conky.config = {
    -- Window settings
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    -- Size and Position
    alignment = 'top_left',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 150,
    minimum_height = 300,
    maximum_width = 200,

    -- Text settings
    use_xft = true,
    font = 'Ubuntu:size=12',
    xftalpha = 0.8,
    update_interval = 1.0,
    uppercase = false,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,

    -- Color scheme
    default_color = 'FFFFFF',
    default_shade_color = '000000',
    default_outline_color = '000000',
    color1 = 'AAAAAA',
    color2 = '00FFFF', -- Accent color for minutes/details
};

conky.conky_text = [[
${color2}${font Ubuntu:size=50}${time %H}${font}
${color}${font Ubuntu:size=50}${time %M}${font}
${voffset 20}${color1}${font Ubuntu:size=10}${time %A}
${color}${font Ubuntu:size=14}${time %B %d}
${color1}${font Ubuntu:size=12}${time %Y}${font}
]];
