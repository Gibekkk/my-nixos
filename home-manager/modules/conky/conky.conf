conky.config = {
  output_backend = 'wayland',

  alignment = 'top_left',
  gap_x = 50,
  gap_y = 40,

  minimum_width = 300,
  maximum_width = 300,
  minimum_height = 540,

  update_interval = 5,
  double_buffer = true,
  background = false,

  -- 'desktop' namespace makes KWin treat it as part of the desktop:
  -- it stays visible during Show Desktop and isn't a normal window
  own_window = true,
  own_window_type = 'normal',
  own_window_namespace = 'desktop',
  own_window_class = 'Conky',
  own_window_title = 'conky-clock',
  own_window_color = '#0000',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  draw_graph_borders = false,

  use_xft = true,
  override_utf8_locale = true,
  text_buffer_size = 2048,

  default_color = 'ffffff',
  color1 = 'cba6f7',
  color2 = 'a6adc8',
};

conky.text = [[
${font Biscuit Glitch:size=110}${color}${time %H}
${voffset -50}${color1}${time %M}${font}${color}
${voffset 40}${font Biscuit Glitch:size=26}${color2}${time %A}
${font Biscuit Glitch:size=56}${color}${time %d}
${font Biscuit Glitch:size=26}${color2}${time %B}
${font Biscuit Glitch:size=26}${color2}${time %Y}${font}${color}
]];
