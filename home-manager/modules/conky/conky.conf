${voffset -6}${color3}${font JetBrains Mono:size=10}${time %A, %d %B %Y}${font}${color}
${voffset 10}${color2}${hr 2}${color}
${voffset 8}${color1}${font JetBrains Mono:bold:size=9}SYSTEM${font}${color}${alignr}${color3}up ${uptime_short}${color}
${voffset 6}${color3}CPU${color}${alignr}${cpu cpu0}%
${color1}${cpubar 4,296}${color}
${voffset 4}${color3}RAM${color}${alignr}${mem} / ${memmax}
${color1}${membar 4,296}${color}
${voffset 4}${color3}SWAP${color}${alignr}${swap} / ${swapmax}
${color1}${swapbar 4,296}${color}
${voffset 4}${color3}DISK /${color}${alignr}${fs_used /} / ${fs_size /}
${color1}${fs_bar 4,296 /}${color}
${if_existing /sys/class/power_supply/BAT0}${voffset 4}${color3}BATTERY${color}${alignr}${battery_percent BAT0}%
${color1}${battery_bar 4,296 BAT0}${color}
${endif}${voffset 8}${color2}${hr 2}${color}
${voffset 8}${color1}${font JetBrains Mono:bold:size=9}NETWORK${font}${color}${alignr}${color3}@IFACE@${color}
${voffset 6}${color3}down${color} ${downspeed @IFACE@}${alignr}${color3}up${color} ${upspeed @IFACE@}
${downspeedgraph @IFACE@ 24,296 5ec8ff 2f7bff}
${upspeedgraph @IFACE@ 24,296 2f7bff 1c3f99}
${voffset 8}${color2}${hr 2}${color}
${voffset 8}${color1}${font JetBrains Mono:bold:size=9}TOP PROCESSES${font}${color}${alignr}${color3}cpu   mem${color}
${voffset 6}${top name 1}${alignr}${top cpu 1}  ${top mem 1}
${top name 2}${alignr}${top cpu 2}  ${top mem 2}
${top name 3}${alignr}${top cpu 3}  ${top mem 3}
]]):gsub('@IFACE@', iface)
