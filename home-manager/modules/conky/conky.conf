-- Rainmeter-style conky, tuned for the dark blue lake wallpaper.
-- Sits in the dark left strip so it never covers the character.

-- Find the default network interface once, at startup (pure Lua, no external tools)
local function default_iface()
  local f = io.open("/proc/net/route")
  if not f then return "lo" end
  for line in f:lines() do
    local iface, dest = line:match("^(%S+)%s+(%x+)")
    if dest == "00000000" then
      f:close()
      return iface
    end
  end
  f:close()
  return "lo"
end
local iface = default_iface()

conky.config = {
  -- Timing
  update_interval = 1,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  double_buffer = true,
  no_buffers = true,
  text_buffer_size = 2048,

  -- Window: translucent navy glass panel
  own_window = true,
  own_window_type = 'desktop',
  own_window_class = 'conky',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = 120,
  own_window_colour = '0a1a38',

  -- Position: top left, over the dark water
  alignment = 'top_left',
  gap_x = 40,
  gap_y = 60,
  minimum_width = 340,
  maximum_width = 340,
  border_inner_margin = 22,
  border_outer_margin = 0,
  border_width = 0,

  -- Drawing
  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  draw_graph_borders = false,

  -- Fonts and colors
  use_xft = true,
  font = 'JetBrains Mono:size=9',
  default_color = 'dbe9ff',   -- soft white-blue text
  color1 = '5ec8ff',          -- accent: light blue from the hair highlights
  color2 = '2f7bff',          -- deep blue: dividers and graphs
  color3 = '7f9cc4',          -- dim labels
